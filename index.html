<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>競馬予想画像メーカー</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #eeeeee;
      color: #222;
      padding: 10px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin: 8px 0 12px;
    }

    .form, .preview-wrap, .image-wrap {
      background: #fff;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-top: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #bbb;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.45;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 11px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      color: white;
      background: #111;
      cursor: pointer;
    }

    .green { background: #087738; }
    .blue { background: #1557b0; }

    .hint {
      font-size: 12px;
      color: #666;
      line-height: 1.55;
      margin-top: 8px;
    }

    .card-area {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    #card {
      width: 1080px;
      height: 1080px;
      transform-origin: top center;
      background:
        linear-gradient(rgba(0,0,0,.52), rgba(0,0,0,.68)),
        radial-gradient(circle at top, #3aa45c, #06371d);
      color: #fff;
      padding: 74px 70px 62px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .top {
      text-align: center;
      border-top: 7px solid #fff;
      border-bottom: 7px solid #fff;
      padding: 28px 10px;
    }

    .date {
      font-size: 34px;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .race {
      font-size: 58px;
      font-weight: 1000;
      margin-top: 12px;
      line-height: 1.12;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .predictions {
      margin-top: 48px;
    }

    .horse {
      display: flex;
      align-items: center;
      gap: 24px;
      margin: 26px 0;
      font-size: 46px;
      font-weight: 950;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .horse-name {
      min-width: 0;
      flex: 1;
    }

    .mark {
      width: 82px;
      height: 82px;
      min-width: 82px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      border-radius: 50%;
      font-size: 50px;
      font-weight: 1000;
    }

    .bets {
      margin-top: 42px;
      background: rgba(255,255,255,.15);
      border: 3px solid rgba(255,255,255,.8);
      padding: 30px;
      font-size: 40px;
      font-weight: 900;
      line-height: 1.42;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 300px;
      overflow: hidden;
    }

    .footer {
      text-align: center;
      font-size: 31px;
      letter-spacing: .08em;
      font-weight: 700;
      border-top: 3px solid rgba(255,255,255,.75);
      padding-top: 24px;
    }

    #generatedImage {
      width: 100%;
      display: none;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .image-title {
      font-weight: 900;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>競馬予想画像メーカー</h1>

    <div class="form">
      <label>日付</label>
      <input id="dateInput" type="date">

      <label>レース名</label>
      <input id="raceInput" type="text" placeholder="例：安田記念">

      <label>◎ 本命</label>
      <input id="honmeiInput" type="text" placeholder="例：7 ソウルラッシュ">

      <label>○ 対抗</label>
      <input id="taikouInput" type="text" placeholder="例：13 ジャンタルマンタル">

      <label>買い目</label>
      <textarea id="betsInput" placeholder="例：ワイド 7-13&#10;馬連 7-13"></textarea>

      <button onclick="updateCard()">プレビュー更新</button>
      <button class="green" onclick="makeImage()">SNS用画像を作る</button>
      <button class="blue" onclick="downloadImage()">PNGを保存</button>

      <div class="hint">
        iPhoneでは「SNS用画像を作る」を押した後、下の完成画像を長押し保存してください。
      </div>
    </div>

    <div class="preview-wrap">
      <div class="hint" style="margin-bottom:8px;">プレビュー</div>
      <div class="card-area">
        <div id="card">
          <div>
            <div class="top">
              <div id="dateText" class="date">2026.06.07</div>
              <div id="raceText" class="race">安田記念</div>
            </div>

            <div class="predictions">
              <div class="horse"><span class="mark">◎</span><span id="honmeiText" class="horse-name">7 ソウルラッシュ</span></div>
              <div class="horse"><span class="mark">○</span><span id="taikouText" class="horse-name">13 ジャンタルマンタル</span></div>
            </div>

            <div id="betsText" class="bets">買い目
ワイド 7-13</div>
          </div>

          <div class="footer">#競馬予想</div>
        </div>
      </div>
    </div>

    <div class="image-wrap">
      <div class="image-title">完成画像</div>
      <div class="hint">表示された画像を長押し保存してください。</div>
      <img id="generatedImage" alt="生成された競馬予想画像">
    </div>
  </div>

  <script>
    let latestImageData = "";

    function fitPreview() {
      const card = document.getElementById("card");
      const area = document.querySelector(".card-area");
      const scale = area.clientWidth / 1080;
      card.style.transform = "scale(" + scale + ")";
      area.style.height = (1080 * scale) + "px";
    }

    function formatDate(value) {
      if (!value) return "日付未入力";
      return value.replaceAll("-", ".");
    }

    function setFontByLength(el, base, min) {
      const len = el.textContent.length;
      let size = base;
      if (len > 18) size = base * 0.82;
      if (len > 24) size = base * 0.70;
      if (len > 32) size = base * 0.60;
      el.style.fontSize = Math.max(size, min) + "px";
    }

    function updateCard() {
      const date = document.getElementById("dateInput").value;
      const race = document.getElementById("raceInput").value.trim();
      const honmei = document.getElementById("honmeiInput").value.trim();
      const taikou = document.getElementById("taikouInput").value.trim();
      const bets = document.getElementById("betsInput").value.trim();

      document.getElementById("dateText").textContent = formatDate(date);
      document.getElementById("raceText").textContent = race || "レース名";
      document.getElementById("honmeiText").textContent = honmei || "本命馬";
      document.getElementById("taikouText").textContent = taikou || "対抗馬";
      document.getElementById("betsText").textContent = "買い目\n" + (bets || "未入力");

      setFontByLength(document.getElementById("raceText"), 58, 34);
      setFontByLength(document.getElementById("honmeiText"), 46, 28);
      setFontByLength(document.getElementById("taikouText"), 46, 28);
      setFontByLength(document.getElementById("betsText"), 40, 27);
    }

    async function makeImage() {
      updateCard();

      const card = document.getElementById("card");
      const oldTransform = card.style.transform;
      card.style.transform = "scale(1)";

      const canvas = await html2canvas(card, {
        backgroundColor: null,
        scale: 1,
        useCORS: true
      });

      card.style.transform = oldTransform;
      latestImageData = canvas.toDataURL("image/png");

      const img = document.getElementById("generatedImage");
      img.src = latestImageData;
      img.style.display = "block";
      img.scrollIntoView({ behavior: "smooth", block: "center" });
      fitPreview();
    }

    async function downloadImage() {
      if (!latestImageData) {
        await makeImage();
      }

      const link = document.createElement("a");
      link.download = "keiba-yosou.png";
      link.href = latestImageData;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener("resize", fitPreview);
    window.addEventListener("load", () => {
      fitPreview();
      updateCard();
    });
  </script>
</body>
</html>
