<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬予想画像メーカー</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #eeeeee;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #222;
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin: 8px 0 14px;
    }

    .box {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-top: 10px;
    }

    input,
    textarea {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #bbb;
      border-radius: 10px;
      background: #fff;
    }

    textarea {
      min-height: 84px;
      line-height: 1.45;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      background: #111;
    }

    .green {
      background: #087738;
    }

    .blue {
      background: #1557b0;
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      line-height: 1.55;
    }

    #card {
      width: 100%;
      aspect-ratio: 1 / 1;
      background:
        linear-gradient(rgba(0,0,0,.50), rgba(0,0,0,.68)),
        radial-gradient(circle at top, #3daa5f, #05351c);
      color: #fff;
      padding: 7%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .top {
      text-align: center;
      border-top: 4px solid #fff;
      border-bottom: 4px solid #fff;
      padding: 5% 2%;
    }

    .date {
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .race {
      margin-top: 3%;
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 1000;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .predictions {
      margin-top: 6%;
    }

    .horse {
      display: flex;
      align-items: center;
      gap: 4%;
      margin: 4% 0;
      font-size: clamp(20px, 5.6vw, 27px);
      font-weight: 950;
      line-height: 1.18;
    }

    .mark {
      width: 15%;
      min-width: 15%;
      aspect-ratio: 1 / 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 1000;
      line-height: 1;
    }

    .horse-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .bets {
      margin-top: 5%;
      padding: 4.5%;
      border: 2px solid rgba(255,255,255,.8);
      background: rgba(255,255,255,.15);
      font-size: clamp(17px, 4.7vw, 23px);
      font-weight: 900;
      line-height: 1.28;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 22%;
      max-height: none;
      overflow: visible;
    }

    .footer {
      text-align: center;
      font-size: clamp(15px, 4.2vw, 20px);
      letter-spacing: 0.08em;
      font-weight: 700;
      border-top: 2px solid rgba(255,255,255,.75);
      padding-top: 4%;
    }

    #generatedImage {
      display: none;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>競馬予想画像メーカー</h1>

    <div class="box">
      <label>日付</label>
      <input id="dateInput" type="date">

      <label>レース名</label>
      <input id="raceInput" type="text" placeholder="例：安田記念">

      <label>◎ 本命</label>
      <input id="honmeiInput" type="text" placeholder="例：7 ソウルラッシュ">

      <label>○ 対抗</label>
      <input id="taikouInput" type="text" placeholder="例：13 ジャンタルマンタル">

      <label>買い目</label>
      <textarea id="betsInput" placeholder="例：ワイド 7-13&#10;馬連 7-13"></textarea>

      <button onclick="updateCard()">プレビュー更新</button>
      <button class="green" onclick="makeImage()">SNS用画像を作る</button>
      <button class="blue" onclick="downloadImage()">PNGを保存</button>

      <div class="hint">
        iPhoneでは「SNS用画像を作る」を押した後、下の完成画像を長押し保存してください。
      </div>
    </div>

    <div class="box">
      <div class="hint" style="margin-bottom:8px;">プレビュー</div>

      <div id="card">
        <div>
          <div class="top">
            <div id="dateText" class="date">2026.06.07</div>
            <div id="raceText" class="race">安田記念</div>
          </div>

          <div class="predictions">
            <div class="horse">
              <span class="mark">◎</span>
              <span id="honmeiText" class="horse-name">7 ソウルラッシュ</span>
            </div>

            <div class="horse">
              <span class="mark">○</span>
              <span id="taikouText" class="horse-name">13 ジャンタルマンタル</span>
            </div>
          </div>

          <div id="betsText" class="bets">買い目
ワイド 7-13</div>
        </div>

        <div class="footer">#競馬予想</div>
      </div>
    </div>

    <div class="box">
      <strong>完成画像</strong>
      <div class="hint">表示された画像を長押し保存してください。</div>
      <img id="generatedImage" alt="生成された競馬予想画像">
    </div>
  </div>

  <script>
    let latestImageData = "";

    function formatDate(value) {
      if (!value) return "日付未入力";
      return value.replaceAll("-", ".");
    }

    function updateCard() {
      const date = document.getElementById("dateInput").value;
      const race = document.getElementById("raceInput").value.trim();
      const honmei = document.getElementById("honmeiInput").value.trim();
      const taikou = document.getElementById("taikouInput").value.trim();
      const bets = document.getElementById("betsInput").value.trim();

      document.getElementById("dateText").textContent = formatDate(date);
      document.getElementById("raceText").textContent = race || "レース名";
      document.getElementById("honmeiText").textContent = honmei || "本命馬";
      document.getElementById("taikouText").textContent = taikou || "対抗馬";
      document.getElementById("betsText").textContent = "買い目\n" + (bets || "未入力");
    }

    async function makeImage() {
      updateCard();

      const card = document.getElementById("card");
      const canvas = await html2canvas(card, {
        backgroundColor: null,
        scale: 3,
        useCORS: true
      });

      latestImageData = canvas.toDataURL("image/png");

      const img = document.getElementById("generatedImage");
      img.src = latestImageData;
      img.style.display = "block";
      img.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    async function downloadImage() {
      if (!latestImageData) {
        await makeImage();
      }

      const link = document.createElement("a");
      link.download = "keiba-yosou.png";
      link.href = latestImageData;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener("load", updateCard);
  </script>
</body>
</html>
