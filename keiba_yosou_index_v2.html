<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>競馬予想画像メーカー</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;padding:14px;background:#f4f4f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic",sans-serif}
    .app{width:100%;max-width:460px;margin:0 auto}
    h1{text-align:center;font-size:24px;margin:18px 0 22px;font-weight:900}
    .panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.08);overflow:hidden}
    label{display:block;margin:14px 0 7px;font-size:16px;font-weight:900}
    input,textarea{display:block;width:100%;max-width:100%;min-width:0;border:1px solid #c9c9c9;border-radius:12px;background:#fff;color:#111;padding:13px 14px;font-size:16px;line-height:1.4;font-family:inherit;appearance:none;-webkit-appearance:none}
    input[type=date]{min-height:50px}
    textarea{min-height:150px;resize:vertical}
    button{width:100%;border:none;border-radius:12px;padding:15px 12px;margin-top:12px;color:#fff;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer}
    .btn-black{background:linear-gradient(180deg,#222,#050505)}
    .btn-green{background:linear-gradient(180deg,#10a552,#087537)}
    .btn-blue{background:linear-gradient(180deg,#1873e6,#0756b8)}
    .note{margin-top:10px;color:#666;font-size:13px;line-height:1.6}
    .preview-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;margin-bottom:12px}
    #card{width:100%;aspect-ratio:1/1;background:#fff;border:1px solid #d9d9d9;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;flex-direction:column}
    .card-date{background:linear-gradient(180deg,#0e9a48,#087236);color:#fff;text-align:center;padding:14px 8px;font-size:clamp(19px,5vw,25px);font-weight:900;letter-spacing:.04em}
    .card-body{flex:1;padding:18px;display:flex;flex-direction:column}
    .race-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;padding-bottom:14px;margin-bottom:10px}
    .race-name{flex:1;min-width:0;font-size:clamp(28px,8vw,43px);font-weight:1000;line-height:1.1;overflow-wrap:anywhere}
    .race-badge{flex:0 0 auto;background:#09944a;color:#fff;border-radius:999px;padding:8px 11px;font-size:clamp(13px,3.7vw,18px);font-weight:900;white-space:nowrap}
    .horse-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd;padding:13px 0;font-size:clamp(18px,5.3vw,27px);font-weight:900;line-height:1.25}
    .symbol{flex:0 0 auto;width:34px;text-align:center;font-size:clamp(24px,7vw,36px);line-height:1}
    .honmei{color:#f01818}.taikou{color:#000}
    .label-small{flex:0 0 auto;font-size:clamp(16px,4.7vw,23px);font-weight:900;white-space:nowrap}
    .horse-name{flex:1;min-width:0;overflow-wrap:anywhere}
    .bets-area{display:flex;margin-top:14px;border:1px solid #ddd;border-radius:10px;overflow:hidden;min-height:110px;flex:1}
    .bets-label{width:52px;background:#0a9447;color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,5.5vw,26px);font-weight:1000;line-height:1.35;writing-mode:vertical-rl;letter-spacing:.18em}
    .bets-text{flex:1;padding:14px 16px;font-size:clamp(18px,5.2vw,26px);font-weight:900;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden}
    .howto{border:1px solid #69b98a;border-radius:14px;padding:14px;background:#f5fff8;font-size:14px;line-height:1.8}
    #generatedImage{width:100%;display:none;border-radius:12px;border:1px solid #ddd;margin-top:10px}
    @media(max-width:380px){body{padding:10px}.panel{padding:14px}.card-body{padding:14px}.bets-label{width:44px}}
  </style>
</head>
<body>
  <div class="app">
    <h1>競馬予想画像メーカー</h1>
    <div class="panel">
      <label for="dateInput">日付</label>
      <input id="dateInput" type="date">
      <label for="raceInput">レース名</label>
      <input id="raceInput" type="text" placeholder="例：安田記念">
      <label for="honmeiInput">◎ 本命</label>
      <input id="honmeiInput" type="text" placeholder="例：7 ソウルラッシュ">
      <label for="taikouInput">○ 対抗</label>
      <input id="taikouInput" type="text" placeholder="例：13 ジャンタルマンタル">
      <label for="betsInput">買い目</label>
      <textarea id="betsInput" placeholder="例：ワイド 7-13&#10;馬連 7-13&#10;3連複 7-13-2"></textarea>
      <div class="note">※ 改行で複数行入力できます。</div>
      <button class="btn-black" onclick="updateCard()">プレビュー更新</button>
      <button class="btn-green" onclick="makeImage()">SNS用画像を作る</button>
      <button class="btn-blue" onclick="resetForm()">リセット</button>
      <div class="note">※ スマホでは完成画像を長押しして保存できます。</div>
    </div>
    <div class="panel">
      <div class="preview-title">▣ プレビュー</div>
      <div id="card">
        <div id="dateText" class="card-date">2026/06/02（火）</div>
        <div class="card-body">
          <div class="race-row">
            <div id="raceText" class="race-name">安田記念</div>
            <div class="race-badge">東京11R</div>
          </div>
          <div class="horse-row">
            <div class="symbol honmei">◎</div><div class="label-small">本命</div><div id="honmeiText" class="horse-name">7 ソウルラッシュ</div>
          </div>
          <div class="horse-row">
            <div class="symbol taikou">○</div><div class="label-small">対抗</div><div id="taikouText" class="horse-name">13 ジャンタルマンタル</div>
          </div>
          <div class="bets-area">
            <div class="bets-label">買い目</div>
            <div id="betsText" class="bets-text">ワイド 7-13
馬連 7-13
3連複 7-13-2</div>
          </div>
        </div>
      </div>
      <div class="note">※ プレビューを参考に、入力内容を調整してください。</div>
      <button class="btn-black" onclick="updateCard()">プレビュー更新</button>
      <button class="btn-green" onclick="makeImage()">SNS用画像を作る</button>
      <button class="btn-blue" onclick="resetForm()">リセット</button>
      <div class="howto">💡 <strong>使い方</strong><br>・各項目を入力<br>・プレビューで確認<br>・「SNS用画像を作る」で画像を生成<br>・完成画像を長押ししてSNSに投稿</div>
    </div>
    <div class="panel">
      <strong>完成画像</strong>
      <div class="note">表示された画像を長押し保存してください。</div>
      <img id="generatedImage" alt="生成された競馬予想画像">
    </div>
  </div>
  <script>
    let latestImageData="";
    function getWeekday(dateString){if(!dateString)return "";const days=["日","月","火","水","木","金","土"];const date=new Date(dateString+"T00:00:00");return days[date.getDay()]}
    function formatDate(value){if(!value)return "2026/06/02（火）";const p=value.split("-");return p[0]+"/"+p[1]+"/"+p[2]+"（"+getWeekday(value)+"）"}
    function updateCard(){
      const date=document.getElementById("dateInput").value;
      const race=document.getElementById("raceInput").value.trim();
      const honmei=document.getElementById("honmeiInput").value.trim();
      const taikou=document.getElementById("taikouInput").value.trim();
      const bets=document.getElementById("betsInput").value.trim();
      document.getElementById("dateText").textContent=formatDate(date);
      document.getElementById("raceText").textContent=race||"安田記念";
      document.getElementById("honmeiText").textContent=honmei||"7 ソウルラッシュ";
      document.getElementById("taikouText").textContent=taikou||"13 ジャンタルマンタル";
      document.getElementById("betsText").textContent=bets||"ワイド 7-13\n馬連 7-13\n3連複 7-13-2";
    }
    async function makeImage(){
      updateCard();
      const card=document.getElementById("card");
      const canvas=await html2canvas(card,{backgroundColor:"#ffffff",scale:3,useCORS:true});
      latestImageData=canvas.toDataURL("image/png");
      const img=document.getElementById("generatedImage");
      img.src=latestImageData;img.style.display="block";img.scrollIntoView({behavior:"smooth",block:"center"});
    }
    function resetForm(){
      document.getElementById("dateInput").value="";
      document.getElementById("raceInput").value="";
      document.getElementById("honmeiInput").value="";
      document.getElementById("taikouInput").value="";
      document.getElementById("betsInput").value="";
      document.getElementById("generatedImage").style.display="none";
      latestImageData="";updateCard();
    }
    window.addEventListener("load",updateCard);
  </script>
</body>
</html>
