<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬予想画像メーカー</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #111;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 18px 0 22px;
      font-weight: 900;
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
      overflow: hidden;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 16px;
      font-weight: 900;
    }

    input, textarea {
      width: 100%;
      max-width: 100%;
      border: 1px solid #0b8c45;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="date"] {
      min-height: 50px;
    }

    textarea {
      min-height: 150px;
      line-height: 1.5;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-black { background: linear-gradient(#222, #050505); }
    .btn-green { background: linear-gradient(#10a552, #087537); }
    .btn-blue { background: linear-gradient(#1873e6, #0756b8); }

    .note {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .preview-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    #card {
      width: 100%;
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card-date {
      background: linear-gradient(#0e9a48, #087236);
      color: #fff;
      text-align: center;
      padding: 14px 8px;
      font-size: 24px;
      font-weight: 900;
    }

    .card-body {
      padding: 18px;
    }

    .race-name {
      font-size: 40px;
      font-weight: 1000;
      line-height: 1.1;
      border-bottom: 3px solid #0b8c45;
      padding-bottom: 14px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .horse-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0b8c45;
      padding: 13px 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
    }

    .symbol {
      width: 34px;
      text-align: center;
      font-size: 34px;
      line-height: 1;
      flex-shrink: 0;
    }

    .honmei { color: #f01818; }
    .taikou { color: #000; }

    .label-small {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .horse-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .bets-area {
      display: flex;
      margin-top: 20px;
      border: 1px solid #0b8c45;
      border-radius: 10px;
      overflow: hidden;
      min-height: 150px;
    }

    .bets-label {
      width: 56px;
      background: #0a9447;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 1000;
      writing-mode: vertical-rl;
      letter-spacing: .18em;
      flex-shrink: 0;
    }

    .bets-text {
      flex: 1;
      padding: 16px;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .howto {
      border: 1px solid #69b98a;
      border-radius: 14px;
      padding: 14px;
      background: #f5fff8;
      font-size: 14px;
      line-height: 1.8;
      margin-top: 16px;
    }

    #generatedImage {
      width: 100%;
      display: none;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-top: 10px;
    }

    @media (max-width: 380px) {
      .race-name { font-size: 34px; }
      .horse-row { font-size: 21px; }
      .bets-text { font-size: 21px; }
      .bets-label { width: 48px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>競馬予想画像メーカー</h1>

    <div class="panel">
      <label>日付</label>
      <input id="dateInput" type="date">

      <label>レース名</label>
      <input id="raceInput" type="text" placeholder="例：安田記念">

      <label>◎ 本命</label>
      <input id="honmeiInput" type="text" placeholder="例：7 ソウルラッシュ">

      <label>○ 対抗</label>
      <input id="taikouInput" type="text" placeholder="例：13 ジャンタルマンタル">

      <label>買い目</label>
      <textarea id="betsInput" placeholder="例：ワイド 7-13&#10;馬連 7-13&#10;3連複 7-13-2&#10;3連単 7→13→2"></textarea>

      <div class="note">※ 改行で複数行入力できます。</div>

      <button class="btn-black" onclick="updateCard()">プレビュー更新</button>
      <button class="btn-green" onclick="makeImage()">SNS用画像を作る</button>
      <button class="btn-blue" onclick="resetForm()">リセット</button>
    </div>

    <div class="panel">
      <div class="preview-title">▣ プレビュー</div>

      <div id="card">
        <div id="dateText" class="card-date">2026/06/02（火）</div>

        <div class="card-body">
          <div id="raceText" class="race-name">安田記念</div>

          <div class="horse-row">
            <div class="symbol honmei">◎</div>
            <div class="label-small">本命</div>
            <div id="honmeiText" class="horse-name">7 ソウルラッシュ</div>
          </div>

          <div class="horse-row">
            <div class="symbol taikou">○</div>
            <div class="label-small">対抗</div>
            <div id="taikouText" class="horse-name">13 ジャンタルマンタル</div>
          </div>

          <div class="bets-area">
            <div class="bets-label">買い目</div>
            <div id="betsText" class="bets-text">ワイド 7-13
馬連 7-13
3連複 7-13-2
3連単 7→13→2</div>
          </div>
        </div>
      </div>

      <button class="btn-black" onclick="updateCard()">プレビュー更新</button>
      <button class="btn-green" onclick="makeImage()">SNS用画像を作る</button>
      <button class="btn-blue" onclick="resetForm()">リセット</button>

      <div class="howto">
        💡 <strong>使い方</strong><br>
        ・各項目を入力<br>
        ・プレビューで確認<br>
        ・「SNS用画像を作る」で画像を生成<br>
        ・完成画像を長押ししてSNSに投稿
      </div>
    </div>

    <div class="panel">
      <strong>完成画像</strong>
      <div class="note">表示された画像を長押し保存してください。</div>
      <img id="generatedImage" alt="生成された競馬予想画像">
    </div>
  </div>

  <script>
    let latestImageData = "";

    function getWeekday(dateString) {
      if (!dateString) return "";
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const date = new Date(dateString + "T00:00:00");
      return days[date.getDay()];
    }

    function formatDate(value) {
      if (!value) return "2026/06/02（火）";
      const p = value.split("-");
      return p[0] + "/" + p[1] + "/" + p[2] + "（" + getWeekday(value) + "）";
    }

    function updateCard() {
      const date = document.getElementById("dateInput").value;
      const race = document.getElementById("raceInput").value.trim();
      const honmei = document.getElementById("honmeiInput").value.trim();
      const taikou = document.getElementById("taikouInput").value.trim();
      const bets = document.getElementById("betsInput").value.trim();

      document.getElementById("dateText").textContent = formatDate(date);
      document.getElementById("raceText").textContent = race || "安田記念";
      document.getElementById("honmeiText").textContent = honmei || "7 ソウルラッシュ";
      document.getElementById("taikouText").textContent = taikou || "13 ジャンタルマンタル";
      document.getElementById("betsText").textContent = bets || "ワイド 7-13\n馬連 7-13\n3連複 7-13-2\n3連単 7→13→2";
    }

    async function makeImage() {
      updateCard();

      const card = document.getElementById("card");
      const canvas = await html2canvas(card, {
        backgroundColor: "#ffffff",
        scale: 3,
        useCORS: true
      });

      latestImageData = canvas.toDataURL("image/png");

      const img = document.getElementById("generatedImage");
      img.src = latestImageData;
      img.style.display = "block";
      img.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetForm() {
      document.getElementById("dateInput").value = "";
      document.getElementById("raceInput").value = "";
      document.getElementById("honmeiInput").value = "";
      document.getElementById("taikouInput").value = "";
      document.getElementById("betsInput").value = "";
      document.getElementById("generatedImage").style.display = "none";
      latestImageData = "";
      updateCard();
    }

    window.addEventListener("load", updateCard);
  </script>
</body>
</html>
